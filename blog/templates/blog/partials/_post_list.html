{% extends "blog/base.html" %}
{% block title %}Posts{% endblock %}
{% block content %}
<h1>Posts</h1>
<div class="row">
  {% for post in page_obj %}
    {% include "blog/partials/_post_card.html" %}
  {% empty %}
    <div class="col-12">
      <p class="text-center text-muted py-5">No posts yet — <a href="{% url 'post_create' %}">write the first one!</a></p>
    </div>
  {% endfor %}
</div>

{% include "blog/partials/_pagination.html" %}
{% endblock %}
