{% if posts %}
  <div class="row">
    {% for post in posts %}
      {% include "blog/partials/_post_card.html" with post=post %}
    {% endfor %}
  </div>

  {% include "blog/partials/_pagination.html" %}
{% else %}
  <div class="alert alert-info text-center">
    Nenhum post por aqui ainda.
  </div>
{% endif %}
