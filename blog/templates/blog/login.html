{% extends "blog/base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="mb-4">Login</h2>

        <form method="post" novalidate>
          {% csrf_token %}

          {% for error in form.non_field_errors %}
            <div class="alert alert-danger">{{ error }}</div>
          {% endfor %}

          <div class="mb-3">
            <label for="{{ form.username.id_for_label }}" class="form-label">Username</label>
            <input type="text" name="username" id="{{ form.username.id_for_label }}"
                   class="form-control" value="{{ form.username.value|default:'' }}" required autofocus>
          </div>

          <div class="mb-3">
            <label for="{{ form.password.id_for_label }}" class="form-label">Password</label>
            <input type="password" name="password" id="{{ form.password.id_for_label }}"
                   class="form-control" required>
          </div>

          <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>

        <p class="mt-3 mb-1 text-center">
          <a href="{% url 'password_reset' %}">Forgot your password?</a>
        </p>
        <p class="mb-0 text-center">
          No account yet? <a href="{% url 'register' %}">Register</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
